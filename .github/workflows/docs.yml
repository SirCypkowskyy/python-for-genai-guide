# Build i publikacja przewodnika na GitHub Pages (generator: Zensical).
#
# Wymog jednorazowej konfiguracji w repozytorium:
#   Settings -> Pages -> Source: "GitHub Actions"
name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Uprawnienia wymagane przez akcje GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Pojedyncze, nieprzerywane wdrozenie na raz.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Konfiguracja GitHub Pages
        uses: actions/configure-pages@v6

      # uv - zunifikowany menedzer pakietow (to samo narzedzie, ktore przewodnik poleca).
      - name: Instalacja uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalacja zaleznosci
        run: uv sync --frozen

      # docs/ -> build/docs/ z konwersja alertow GFM na admonitiony Zensical.
      - name: Przygotowanie dokumentow
        run: uv run python scripts/prepare_docs.py

      # --strict: build konczy sie bledem przy nierozwiazanych linkach itp.
      - name: Build strony
        run: uv run zensical build --clean --strict

      - name: Upload artefaktu
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Wdrozenie na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
